      <div class="block-content">
        <header class="header-content">
          <div class="header-block">
            <h1 class="header-title">Welcome, Amanda</h1>
            <p class="header-text">Tue, 07 June 2022</p>
          </div>
          <div class="header-block1">
            <input type="text" class="header-input" placeholder="Search" />
            <a href="#0">
              <span class="header-block-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >

                  />
                </svg>
              </span>
            </a>
            <img
              src="./Images/Rectangle-person.svg"
              alt="Профиль"
              id="profile-account"
            />
            <div class="profile-popup" id="profile-popup">
              <p class="profile-next">Профиль</p>
              <img src="./Images/Rectangle-person.svg" alt="Профиль" />
              <span></span>
              <div id="profile-info" class="profile-data">
                
              </div>
            </div>
          </div>
        </header>
        <div class="background-block"></div>
        <section class="person-profile">
          <div class="block-person-profile">
            <img src="./Images/Ellipse-person.svg" alt="Персона" />
            <div class="block-data-person">
              <p class="text-name-person">Alexa Rawles</p>
              <p class="text-person">alexarawles@gmail.com</p>
            </div>
          </div>
          <button type="button" class="button-edit" id="edit-btn">Edit</button>
        </section>
        <section class="registration">
          <form id="form">
            <ul class="form-registration-list-item">
              <li class="form-registration-list">
                <label for="fullname">Full Name</label>
                <input
                  type="text"
                  id="fullname"
                  name="fullname"
                  placeholder="Your First Name"
                  class="form-input-style"
                />
              </li>
              <li class="form-registration-list">
                <label for="nickname">Nick Name</label>
                <input
                  type="text"
                  id="nickname"
                  name="nickname"
                  placeholder="Your Nick Name"
                  class="form-input-style"
                />
              </li>
              <li class="form-registration-list">
                <label for="gender">Gender</label>
                <select
                  id="gender"
                  name="gender"
                  class="form-input-style form-icon"
                >
                  <option value="" selected hidden>Your Nick Name</option>
                  <option>Мужской</option>
                  <option>Женский</option>
                </select>
              </li>
              <li class="form-registration-list">
                <label for="country">Country</label>
                <select
                  id="country"
                  name="country"
                  class="form-input-style form-icon"
                >
                  <option value="" selected hidden>Your Nick Name</option>
                </select>
              </li>
              <li class="form-registration-list">
                <label for="language">Language</label>
                <select
                  id="language"
                  name="language"
                  class="form-input-style form-icon"
                >
                  <option value="" selected hidden>Your Nick Name</option>
                </select>
              </li>
              <li class="form-registration-list">
                <label for="timezone">Time Zone</label>
                <select
                  id="timezone"
                  name="timezone"
                  class="form-input-style form-icon"
                >
                  <option value="" selected hidden>Your Nick Name</option>
                </select>
              </li>
            </ul>
          </form>
          <span class="text-address">My email Address</span>
          <div class="block-text-address">
            <span class="sms-icon">
              <img src="./Images/sms.svg" alt="sms" />
            </span>
            <div class="block-text">
              <p>alexarawles@gmail.com</p>
              <p class="text-person">1 month ago</p>
            </div>
          </div>
          <button class="button-style-address">+Add Email Address</button>
        </section>
      </div>
    </div>
